{% if access_list_id > 0 %}
    {% if access_list.client_cas.length > 0 %}
    # mTLS: a client certificate issued by one of the access list's Client CAs
    auth_request /__npm_mtls/{{ access_list_id }};
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
    proxy_set_header X-SSL-Client-Serial $ssl_client_serial;

    {% endif %}
    {% if access_list.items.length > 0 %}
    # Authorization
    auth_basic            "Authorization required";
    auth_basic_user_file  /data/access/{{ access_list_id }};

    {% if access_list.pass_auth == 0 or access_list.pass_auth == false %}
    proxy_set_header Authorization "";
    {% endif %}

    {% endif %}

    {% if access_list.clients.length > 0 %}
    # Access Rules: {{ access_list.clients | size }} total
    {% for client in access_list.clients %}
    {{client | nginxAccessRule}}
    {% endfor %}
    deny all;
    {% endif %}

    # Access checks must...
    {% if access_list.satisfy_any == 1 or access_list.satisfy_any == true %}
    satisfy any;
    {% else %}
    satisfy all;
    {% endif %}
{% endif %}
