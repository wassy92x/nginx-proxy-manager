{% if mtls_enabled %}
{% if certificate and certificate_id > 0 %}
  # mTLS: request a client certificate, which locations require it is decided by their access list
  ssl_client_certificate {{ client_ca_bundle }};
  ssl_crl                {{ client_crl_bundle }};
  ssl_verify_client      optional;
  ssl_verify_depth       1;
{% endif %}

  # mTLS checks, used by auth_request so they are part of "satisfy" like the other access rules
{% for mtls_list in mtls_access_lists %}
  location = /__npm_mtls/{{ mtls_list.id }} {
    internal;
    if ($ssl_client_verify != "SUCCESS") {
      return 403;
    }
    if ($ssl_client_i_dn !~ "(^|,)OU=npm-client-ca-({{ mtls_list.client_ca_ids | join: "|" }})(,|$)") {
      return 403;
    }
    return 204;
  }
{% endfor %}
{% endif %}
